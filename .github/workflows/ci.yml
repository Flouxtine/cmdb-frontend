name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法与测试
        run: |
          pip install -r requirements.txt -q
          python -m py_compile app/*.py app/providers/*.py
          python -m pytest tests/ -q
          echo "OK"

  # 分支推送：构建并推 latest（显式 docker 命令，错误可直接看到）
  docker:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建镜像
        run: docker build -t ${{ env.IMAGE }}:latest . 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
      - name: 上传构建日志(诊断用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: /tmp/build.log

  # tag 推送：构建并推版本号
  docker-versioned:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建镜像
        run: docker build -t ${{ env.IMAGE }}:latest -t ${{ env.IMAGE }}:${{ github.ref_name }} .
      - name: 推送镜像
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.ref_name }}
