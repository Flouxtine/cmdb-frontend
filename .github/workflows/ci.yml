name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法与测试
        run: |
          pip install -r requirements.txt -q
          python -m py_compile app/*.py app/providers/*.py
          python -m pytest tests/ -q
          echo "OK"

  # 分支推送：构建并推 latest
  docker:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建推送 latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

  # tag 推送：构建并推版本号（v1.0.0 → 1.0.0）
  docker-versioned:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建推送版本号
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}

  # 发布事件上报（可选，需平台地址可达）
  report-release:
    needs: docker-versioned
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 上报发布到 OpsScope
        if: ${{ secrets.OPS_SCOPE_WEBHOOK_URL != '' }}
        env:
          URL: ${{ secrets.OPS_SCOPE_WEBHOOK_URL }}
          VERSION: ${{ github.ref_name }}
        run: |
          curl -s -X POST "$URL/api/deployments" -H "Content-Type: application/json" \
            -d "{\"service\":\"opsscope\",\"version\":\"$VERSION\",\"commit\":\"${{ github.sha }}\",\"author\":\"${{ github.actor }}\",\"source\":\"github-actions\"}" \
            && echo "已上报 $VERSION"
